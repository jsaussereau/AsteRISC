###########################################
# Settings for AsteRISC_RV32I_soc_10S-10S #
###########################################

rtl_path: AsteRISC-rtl/rtl
top_level_file: soc/soc_wrapper_top.sv
top_level_module: soc_wrapper_top
rtl_file_format: .sv
clock_signal: i_xtal_p
reset_signal: i_rst

use_parameters: true
start_delimiter: '  // <main>'
stop_delimiter: '  // </main>'

# Configurations
configurations:

# Multicycle: the buffers vary, the stages are fixed
  name: "M${value_dec}"
  template: |2

    parameter p_pipeline        = 0,

    parameter p_stage_IF        = 1,
    parameter p_stage_IC        = 0,
    parameter p_stage_ID        = 1,
    parameter p_stage_RF        = 1,
    parameter p_stage_EX        = 1,
    parameter p_stage_MA        = 1,
    parameter p_stage_WB        = 1,

    parameter p_fetch_buf       = $p_fetch_buf,
    parameter p_decode_buf      = $p_decode_buf,
    parameter p_rf_sp           = $p_rf_sp,
    parameter p_rf_read_buf     = $p_rf_read_buf,
    parameter p_branch_buf      = $p_branch_buf,
    parameter p_mem_buf         = $p_mem_buf,
    parameter p_wb_buf          = $p_wb_buf,
  constraints:
  - ${p_rf_sp} <= ${p_rf_read_buf}

fmax_synthesis:
  lower_bound: 50
  upper_bound: 2000
custom_freq_synthesis:
  list:
  - 50

xc7s25-csga225-1:
  fmax_synthesis:
    lower_bound: 50
    upper_bound: 170
xc7a100t-csg324-1:
  fmax_synthesis:
    lower_bound: 50
    upper_bound: 300
xc7k70t-fbg676-2:
  fmax_synthesis:
    lower_bound: 80
    upper_bound: 300
ST28CMOSFDSOI:
  fmax_synthesis:
    lower_bound: 500
    upper_bound: 2000

variables:
  p_fetch_buf:
    type: bool
    settings: {}
  p_decode_buf:
    type: bool
    settings: {}
  p_branch_buf:
    type: bool
    settings: {}
  p_mem_buf:
    type: bool
    settings: {}
  p_wb_buf:
    type: bool
    settings: {}
  p_rf_sp:
    type: bool
    settings: {}
  p_rf_read_buf:
    type: bool
    settings: {}
  value_bin:
    type: format
    settings:
      source: 
        ${p_fetch_buf}${p_decode_buf}${p_branch_buf}${p_mem_buf}${p_wb_buf}${p_rf_sp}${p_rf_read_buf}
  value_dec:
    type: conversion
    settings:
      from: bin
      to: dec
      source: ${value_bin}
    format: '%04d'
match: {}
