###########################################
# Parameter Domain - IMEM                  #
###########################################

start_delimiter: "  // <mem>"
stop_delimiter: "  // </mem>"

# Configurations
configurations:
  name: "${imem_depth_pw2}I_${dmem_depth_pw2}D"
  template: "\n parameter p_imem_depth_pw2  = $imem_depth,\n parameter p_dmem_depth_pw2\
    \  = $dmem_depth,\n"
variables:
  imem_depth:
    type: range
    settings:
      from: 8
      to: 12
      step: 1
  dmem_depth:
    type: range
    settings:
      from: 8
      to: 12
      step: 1
  imem_depth_pw2:
    type: function
    settings:
      op: 2^$imem_depth
  dmem_depth_pw2:
    type: function
    settings:
      op: 2^$dmem_depth
