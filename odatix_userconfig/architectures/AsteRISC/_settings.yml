###########################################
# Settings for AsteRISC_RV32I_soc_10S-10S #
###########################################

rtl_path: AsteRISC-rtl/rtl
top_level_file: soc/soc_wrapper_top.sv
top_level_module: soc_wrapper_top
rtl_file_format: .sv
clock_signal: i_xtal_p
reset_signal: i_rst

use_parameters: true
start_delimiter: '  // <main>'
stop_delimiter: '  // </main>'

# Configurations
configurations:
  name: "M${value_dec}"
  template: "\n  parameter p_pipeline        = 0,\n  parameter p_stage_IF        =
    1,\n  parameter p_stage_IC        = 0,\n  parameter p_stage_ID        = 1,\n \
    \ parameter p_stage_RF        = 1,\n  parameter p_stage_EX        = 1,\n  parameter
    p_stage_MA        = 1,\n  parameter p_stage_WB        = 1,\n\n  parameter p_prefetch_buf\
    \    = $p_prefetch_buf,\n  parameter p_decode_buf      = $p_decode_buf,\n  parameter
    p_rf_sp           = $p_rf_sp,\n  parameter p_rf_read_buf     = $p_rf_read_buf,\n\
    \  parameter p_branch_buf      = $p_branch_buf,\n  parameter p_mem_buf       \
    \  = $p_mem_buf,\n  parameter p_wb_buf          = $p_wb_buf,"
  constraints:
  - ${p_rf_sp} <= ${p_rf_read_buf}

fmax_synthesis:
  lower_bound: 50
  upper_bound: 2000
custom_freq_synthesis:
  list:
  - 50

xc7s25-csga225-1:
  fmax_synthesis:
    lower_bound: 50
    upper_bound: 170
xc7a100t-csg324-1:
  fmax_synthesis:
    lower_bound: 50
    upper_bound: 300
xc7k70t-fbg676-2:
  fmax_synthesis:
    lower_bound: 80
    upper_bound: 300
ST28CMOSFDSOI:
  fmax_synthesis:
    lower_bound: 500
    upper_bound: 2000

variables:
  p_prefetch_buf:
    type: bool
    settings: {}
  p_decode_buf:
    type: bool
    settings: {}
  p_branch_buf:
    type: bool
    settings: {}
  p_mem_buf:
    type: bool
    settings: {}
  p_wb_buf:
    type: bool
    settings: {}
  p_rf_sp:
    type: bool
    settings: {}
  p_rf_read_buf:
    type: bool
    settings: {}
  value_bin:
    type: format
    settings:
      source: 
        ${p_prefetch_buf}${p_decode_buf}${p_branch_buf}${p_mem_buf}${p_wb_buf}${p_rf_sp}${p_rf_read_buf}
  value_dec:
    type: conversion
    settings:
      from: bin
      to: dec
      source: ${value_bin}
    format: '%04d'
