##############################################
# Odatix design space exploration campaign
##############################################
---

# architectures to explore, one search each
architectures:
  - AsteRISC-M/* + Baseline/I + MEM/1024I_1024D + MemLatency/SRAM1 + Cache/Off + ALU/* + Mul/* + BranchPred/* + Overlap/*
  - AsteRISC-P/* + Baseline/I + MEM/1024I_1024D + MemLatency/SRAM1 + Cache/Off + ALU/* + Mul/* + BranchPred/* + BTB/* + Fwd/* + PipeCtrl/*

# what this campaign leaves out of the space
exclusions:
  apply: [illegal, duplicate, dominated]

# simulations every design is run through, before it is measured
simulations:
  - coremark

# what evaluating one design runs
run:              custom_freq_synthesis # fmax_synthesis, custom_freq_synthesis or workflow
tool:             vivado                # overridden by -t / --tool
flow:             [""]                  # empty: the default flow of the tool
until:            pnr                   # flow step to stop at: synth, pnr, bitstream, ...

# at what frequency, when what runs is a custom frequency synthesis
frequencies:
  explore:        Yes     # yes: each design gets a frequency of its own, chosen in the range below
  list:           []      # if 'explore' is no, every design is synthesized at each of those
  range:                  # if 'explore' is yes, the frequencies the search may choose from
    from:         40
    to:           300
    step:         5

# what makes a design better than another
objectives:
  - metric: CoreMark
    goal: max
  - metric: LUT_count
    goal: min
  - metric: Reg_count
    goal: min
  - metric: Total_Power
    goal: min

constraints:
  - metric: Worst_Slack
    min: 0

# how the search looks for it
search:
  strategy:       bayesian # genetic, bayesian, random or exhaustive - overridden by --strategy
  mode:           async
  budget:         256      # designs evaluated at most, per architecture - overridden by --budget
  batch:          12       # designs evaluated together, between two decisions
  patience:       0        # stop after this many batches that do not improve (0: never)
  seed:                    # empty: a different search every time
